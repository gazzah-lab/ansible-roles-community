---
- name: Install administrative shell presentation
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/etc/profile.d/{{ item }}'
    mode: '0755'
  loop: [global-prompt.sh, infra-motd.sh]

- name: Remove the redundant static Debian MOTD
  ansible.builtin.copy:
    content: ''
    dest: /etc/motd
    mode: '0644'
