---
- name: Validate supported VM platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
      - debian_baseline_permit_root_login in ['no', 'prohibit-password', 'yes']
    fail_msg: This baseline is designed for Debian 13 VMs, not Proxmox hosts or routers.
  tags: [always]

- name: Configure package policy
  ansible.builtin.import_tasks: apt.yml
  when: "'apt' in debian_baseline_sections"
  tags: [apt]

- name: Configure system identity
  ansible.builtin.import_tasks: identity.yml
  when: "'identity' in debian_baseline_sections"
  tags: [identity]

- name: Configure administrative shell
  ansible.builtin.import_tasks: shell.yml
  when: "'shell' in debian_baseline_sections"
  tags: [shell, motd]

- name: Configure SSH daemon
  ansible.builtin.import_tasks: ssh.yml
  when: "'ssh' in debian_baseline_sections"
  tags: [ssh]

- name: Configure VM services
  ansible.builtin.import_tasks: services.yml
  when: "'services' in debian_baseline_sections"
  tags: [services]

- name: Configure unattended security upgrades
  ansible.builtin.import_tasks: unattended.yml
  when: "'unattended' in debian_baseline_sections"
  tags: [unattended]
