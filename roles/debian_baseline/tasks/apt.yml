---
- name: Configure canonical Debian repositories
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    mode: '0644'
  register: debian_baseline_sources
  when: debian_baseline_manage_repositories | bool

- name: Disable legacy duplicate Debian sources
  ansible.builtin.copy:
    content: |
      # Debian repositories are managed in sources.list.d/debian.sources
    dest: /etc/apt/sources.list
    mode: '0644'
  when: debian_baseline_manage_repositories | bool

- name: Configure local APT policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-local
    mode: '0644'
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
      Acquire::Retries "3";
      Dpkg::Use-Pty "0";

- name: Refresh package indexes after repository changes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when:
    - debian_baseline_sources is changed
    - not ansible_check_mode
