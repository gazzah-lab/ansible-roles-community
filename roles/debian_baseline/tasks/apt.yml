---
- name: Configure canonical Debian repositories
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    mode: '0644'
  when: debian_baseline_manage_repositories | bool

- name: Disable legacy duplicate Debian sources
  ansible.builtin.copy:
    content: |
      # Debian repositories are managed in sources.list.d/debian.sources
    dest: /etc/apt/sources.list
    mode: '0644'
  when: debian_baseline_manage_repositories | bool

- name: Configure local APT policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-local
    mode: '0644'
    content: |
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
      Acquire::Retries "3";
      Dpkg::Use-Pty "0";
