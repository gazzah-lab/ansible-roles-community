---
- name: Install automatic security update tooling
  ansible.builtin.apt:
    name: [unattended-upgrades, apt-listchanges]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable daily security update policy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Enable "1";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure security-only unattended upgrades
  ansible.builtin.template:
    src: unattended.conf.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'

- name: Enable APT timers
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
  when: debian_baseline_manage_services | bool
