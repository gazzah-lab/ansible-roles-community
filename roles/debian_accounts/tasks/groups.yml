---
- name: Configure explicitly declared groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ debian_accounts_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create primary groups declared with a GID
  ansible.builtin.group:
    name: "{{ item.group }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ debian_accounts_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default('present') == 'present'
    - item.group is defined
    - item.gid is defined
    - item.group not in (debian_accounts_groups | map(attribute='name') | list)
  # Les éléments de cette boucle peuvent contenir un hash de mot de passe.
  no_log: true
