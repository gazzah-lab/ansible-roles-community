---
name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Install SSH collection
        run: ansible-galaxy collection install ansible.posix:2.2.2 community.general:13.4.0
      - name: Install local collection for module resolution
        run: |
          mkdir -p build
          ansible-galaxy collection build --output-path build --force
          ansible-galaxy collection install build/gazzah-community-*.tar.gz --force --no-deps
      - name: Test migration planning
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check role
        run: ansible-lint --offline roles/debian_accounts roles/debian_baseline
      - name: Check YAML
        run: yamllint .
      - name: Build collection
        run: |
          mkdir -p build
          ansible-galaxy collection build --output-path build --force
