---
name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: pip install -r requirements-dev.txt
      - name: Install SSH collection
        run: ansible-galaxy collection install ansible.posix:2.2.2
      - name: Check role
        run: ansible-lint --offline roles/debian_accounts
      - name: Check YAML
        run: yamllint .
      - name: Build collection
        run: |
          mkdir -p build
          ansible-galaxy collection build --output-path build
